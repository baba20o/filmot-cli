name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            transcript_dependency: "youtube-transcript-api==1.1.0"
          - python-version: "3.x"
            transcript_dependency: "youtube-transcript-api>=1.1.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "${{ matrix.transcript_dependency }}"

      - name: Verify package and CLI imports
        run: |
          python -c "import filmot; from filmot.cli import cli; assert cli"
          filmot --help >/dev/null

      - name: Run test suite
        run: python -m pytest -q
