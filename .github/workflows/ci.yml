name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu / ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Python 3.9 floor
            python-version: "3.9"
            transcript_dependency: "youtube-transcript-api==1.1.0"
          - label: Python 3.14 latest
            python-version: "3.14"
            transcript_dependency: "youtube-transcript-api>=1.1.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "${{ matrix.transcript_dependency }}"

      - name: Verify package and CLI imports
        run: |
          python -c "import filmot; from filmot.cli import cli; assert cli"
          filmot --help >/dev/null

      - name: Run test suite
        run: python -m pytest -q

  windows-cancellation:
    name: Windows / transcript cancellation
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "youtube-transcript-api>=1.1.0"

      - name: Run transcript worker and cancellation tests
        run: >-
          python -m pytest -q
          tests/test_transcript.py
          tests/test_transcript_worker.py
          tests/test_process.py
